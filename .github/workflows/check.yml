# push と pull request のたびに、画面をまとめ直して単体テストを全部流す（npm run check）。
# Cloudflare のアカウントも秘密の値も使わない。本番に上げるのは手元の npm run deploy のまま。
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
